receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        include_metadata: true
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  attributes/routing:
    actions:
      # Clear any payload-provided values; transport headers are authoritative.
      - key: arize.space_id
        action: delete
      - key: arize.space_id
        from_context: metadata.space_id
        action: upsert
      - key: arize.auth
        action: delete
      - key: arize.auth
        from_context: metadata.arize_api_key
        action: upsert
  filter/require_route:
    error_mode: propagate
    trace_conditions:
      - 'span.attributes["arize.space_id"] == nil'
      - 'not IsMatch(span.attributes["arize.space_id"], "^[A-Za-z0-9+/]+={0,2}$")'
      - 'span.attributes["arize.auth"] == nil'
      - 'span.attributes["arize.auth"] == ""'
  attributes/redact:
    actions:
      # The credential exists only so the filter above can see it: drop it
      # before batching, so it never reaches an exporter or the debug log.
      - key: arize.auth
        action: delete
  batch:
    timeout: 1s
    send_batch_size: 512
    # Never batch different destination spaces or credentials into one request.
    metadata_keys: [space_id, arize_api_key]
    metadata_cardinality_limit: 100

exporters:
  otlp_http/arize:
    # Full signal URL: do not append /v1/traces a second time.
    traces_endpoint: ${env:ARIZE_COLLECTOR_ENDPOINT}
    # Verified with Arize HTTP: gzip returned 400; uncompressed protobuf works.
    compression: none
    headers:
      arize-interface: otel-collector
    auth:
      authenticator: headers_setter
    timeout: 15s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
  debug:
    # Counts only; do not log prompts, responses, or auth headers.
    verbosity: basic

extensions:
  headers_setter:
    headers:
      # Translate the client's names into the ones Arize HTTP expects.
      - action: upsert
        key: arize-space-id
        from_context: space_id
      - action: upsert
        key: authorization
        from_context: arize_api_key
        # No defaults: the Collector holds no credential and no destination of
        # its own, so a request missing either header is dropped by the filter.
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check, headers_setter]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/routing, filter/require_route, attributes/redact, batch]
      exporters: [otlp_http/arize, debug]
