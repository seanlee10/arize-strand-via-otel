receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp_http/arize:
    # Full signal URL: do not append /v1/traces a second time.
    traces_endpoint: ${env:ARIZE_COLLECTOR_ENDPOINT}
    # Verified with Arize HTTP: gzip returned 400; uncompressed protobuf works.
    compression: none
    headers:
      authorization: ${env:ARIZE_API_KEY}
      arize-space-id: ${env:ARIZE_SPACE_ID}
      arize-interface: otel-collector
    timeout: 15s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
  debug:
    # Counts only; do not log prompts, responses, or auth headers.
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/arize, debug]
